services:
  db2:
    image: icr.io/db2_community/db2
    container_name: gym-db2
    privileged: true
    restart: unless-stopped
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: gympass123
      DBNAME: GYMDB
    volumes:
      - db2data:/database

volumes:
  db2data:
